<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./resource-form.scss">
</head>
<body>

    <div class="overlay">
        <div class="modal">

                <button type="button" class="close-button" (click)="onClose()" aria-label="Schließen">&#10005;</button>

            <form method="post">

                <div class="form-group">
                    <label for="rescourceName">Artikel Name:</label>
                    <input type="text" id="rescourceName" name="rescourceName">
                </div>

                <div class="form-group">
                    <label for="rescourceDesc">Artikel Beschreibung:</label>
                    <input type="text" id="rescourceDesc" name="rescourceDesc">
                </div>

                <div class="form-group">
                    <label for="size">Größe:</label>
                    <input type="text" id="size" name="size">
                </div>

                <div class="form-group">
                    <label for="material">Material:</label>
                    <input type="text" id="material" name="material">
                </div>

                <div class="form-group">
                    <label for="gender">Gender:</label>
                    <input type="text" id="gender" name="gender">
                </div>

                <div class="form-group">
                    <label for="manufacturer">Hersteller:</label>
                    <input type="text" id="manufacturer" name="manufacturer">
                </div>

                <button type="submit">Absenden</button>
                <button type="reset">Reset</button>

            </form>
        </div>
    </div>

</body>
</html>
