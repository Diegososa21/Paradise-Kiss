<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="rescourceForm.css">
</head>
<body>



    <h1>Das ist die Seite dahinter</h1>
    <p>Dieser Text bleibt sichtbar, auch wenn das Modal offen ist.</p>

    <div class="overlay">
        <div class="modal">
            <form method="post">

                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name">
                </div>

                <div class="form-group">
                    <label for="email">E-Mail:</label>
                    <input type="text" id="email" name="email">
                </div>

                <button type="submit">Absenden</button>
                <button type="reset">Abbrechen</button>

            </form>
        </div>
    </div>

</body>
</html>
