<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Artikel hinzufügen</title>
    <style>
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal {
            background-color: #474747;
            padding: 20px;
            border-radius: 5px;
            width: 400px;
        }

        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            padding: 8px;
            border: 1px solid black;
            border-radius: 4px;
        }

        button {
            padding: 10px;
            background-color: pink;
            color: black;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Das ist die Seite dahinter</h1>
    <p>Dieser Text bleibt sichtbar, auch wenn das Modal offen ist.</p>

    <div class="overlay">
        <div class="modal">
            <form method="post">

                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name">
                </div>

                <div class="form-group">
                    <label for="email">E-Mail:</label>
                    <input type="text" id="email" name="email">
                </div>

                <button type="submit">Absenden</button>
                <button type="reset">Abbrechen</button>

            </form>
        </div>
    </div>

</body>
</html>
