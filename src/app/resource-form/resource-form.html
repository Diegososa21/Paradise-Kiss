<main class="resource-page">
  <section class="resource-modal" aria-labelledby="resource-title">
    <p class="eyebrow">Paradise Kiss</p>
    <h1 id="resource-title">Artikel hinzufügen</h1>
    <p class="intro">Teile einen neuen Artikel mit deiner Community.</p>

    <form method="post">
      <div class="form-group">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" />
      </div>

      <div class="form-group">
        <label for="email">E-Mail:</label>
        <input type="email" id="email" name="email" />
      </div>

      <div class="form-actions">
        <button type="submit">Absenden</button>
        <a routerLink="/" class="cancel-button">Abbrechen</a>
      </div>
    </form>
  </section>
</main>
